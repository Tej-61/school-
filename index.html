<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notes Hub – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f1117;--card:#181c27;--accent:#6c63ff;--accent2:#a78bfa;--text:#f0f0f5;--muted:#8b8fa8;--border:#2a2e3d;--red:#f87171;--green:#22c55e}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
    body::before{content:'';position:fixed;width:500px;height:500px;background:radial-gradient(circle,rgba(108,99,255,.18) 0%,transparent 70%);top:-150px;left:-150px;pointer-events:none}
    body::after{content:'';position:fixed;width:400px;height:400px;background:radial-gradient(circle,rgba(167,139,250,.12) 0%,transparent 70%);bottom:-100px;right:-100px;pointer-events:none}
    .wrap{width:100%;max-width:420px;position:relative;z-index:1}
    .brand{text-align:center;margin-bottom:36px}
    .brand-icon{width:52px;height:52px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px;box-shadow:0 8px 24px rgba(108,99,255,.35)}
    .brand h1{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700}
    .brand p{color:var(--muted);font-size:14px;margin-top:4px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 32px}
    .tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:28px}
    .tab-btn{flex:1;padding:9px;border:none;background:transparent;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;transition:all .2s}
    .tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(108,99,255,.4)}
    .form-group{margin-bottom:18px}
    label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
    input{width:100%;padding:12px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;transition:border-color .2s,box-shadow .2s;outline:none;font-family:'Inter',sans-serif}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
    input::placeholder{color:#3a3e4d}
    .btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .15s;box-shadow:0 4px 16px rgba(108,99,255,.35)}
    .btn:hover{opacity:.9;transform:translateY(-1px)}
    .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .error-box{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--red);margin-bottom:16px;display:none}
    .success-box{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--green);margin-bottom:16px;display:none}
    #register-panel{display:none}
    .loader{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon">📚</div>
    <h1>Notes Hub</h1>
    <p>Your classroom, connected</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tab-reg" onclick="switchTab('register')">Register</button>
    </div>

    <div id="error-box" class="error-box"></div>
    <div id="success-box" class="success-box"></div>

    <!-- LOGIN -->
    <div id="login-panel">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="student@school.edu"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <button class="btn" id="login-btn" onclick="doLogin()">Sign In →</button>
    </div>

    <!-- REGISTER -->
    <div id="register-panel">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Apna poora naam"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="student@school.edu"/>
      </div>
      <div class="form-group">
        <label>Class / Section</label>
        <input type="text" id="reg-class" placeholder="e.g. 10-A, CS-301"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-pass" placeholder="Minimum 6 characters" onkeydown="if(event.key==='Enter')doRegister()"/>
      </div>
      <button class="btn" id="reg-btn" onclick="doRegister()">Create Account →</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADqcDzajzBja4t7Gx310bTLSColxcz2Ns",
    authDomain: "school-29086.firebaseapp.com",
    projectId: "school-29086",
    storageBucket: "school-29086.firebasestorage.app",
    messagingSenderId: "358547829043",
    appId: "1:358547829043:web:0e105cb2d411654db14e46"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Agar already logged in hai to dashboard pe bhejo
  onAuthStateChanged(auth, user => {
    if (user) window.location.href = 'dashboard.html';
  });

  function showError(msg) {
    const e = document.getElementById('error-box');
    const s = document.getElementById('success-box');
    s.style.display = 'none';
    e.textContent = '⚠️ ' + msg;
    e.style.display = 'block';
  }
  function showSuccess(msg) {
    const e = document.getElementById('error-box');
    const s = document.getElementById('success-box');
    e.style.display = 'none';
    s.textContent = '✓ ' + msg;
    s.style.display = 'block';
  }
  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading ? '<span class="loader"></span> Please wait…' : btn.dataset.label;
  }

  document.getElementById('login-btn').dataset.label = 'Sign In →';
  document.getElementById('reg-btn').dataset.label = 'Create Account →';

  window.switchTab = function(tab) {
    document.getElementById('login-panel').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('register-panel').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-reg').classList.toggle('active', tab === 'register');
    document.getElementById('error-box').style.display = 'none';
    document.getElementById('success-box').style.display = 'none';
  };

  window.doLogin = async function() {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-pass').value;
    if (!email || !pass) { showError('Email aur password daalo'); return; }
    setLoading('login-btn', true);
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      // onAuthStateChanged redirect karega
    } catch(e) {
      setLoading('login-btn', false);
      if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') showError('Email ya password galat hai');
      else if (e.code === 'auth/too-many-requests') showError('Zyada attempts — thodi der baad try karo');
      else showError(e.message);
    }
  };

  window.doRegister = async function() {
    const name  = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const cls   = document.getElementById('reg-class').value.trim();
    const pass  = document.getElementById('reg-pass').value;
    if (!name || !email || !pass) { showError('Saari fields bharo'); return; }
    if (pass.length < 6) { showError('Password kam se kam 6 characters ka hona chahiye'); return; }
    setLoading('reg-btn', true);
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      // Firestore mein user save karo
      await setDoc(doc(db, 'users', cred.user.uid), {
        name, email, cls, uid: cred.user.uid,
        createdAt: serverTimestamp()
      });
      showSuccess('Account ban gaya! Redirect ho raha hai…');
    } catch(e) {
      setLoading('reg-btn', false);
      if (e.code === 'auth/email-already-in-use') showError('Yeh email already registered hai — Sign In karo');
      else if (e.code === 'auth/invalid-email') showError('Email format sahi nahi hai');
      else showError(e.message);
    }
  };
</script>
</body>
</html>
