<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notes Hub – Friends</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f1117;--card:#181c27;--accent:#6c63ff;--accent2:#a78bfa;--text:#f0f0f5;--muted:#8b8fa8;--border:#2a2e3d;--green:#22c55e}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
    .sidebar{width:240px;min-height:100vh;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 16px;position:fixed;left:0;top:0}
    .logo{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:36px}
    .logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
    .logo span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px}
    .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:0 12px;margin-bottom:8px}
    .nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;transition:all .2s;margin-bottom:4px}
    .nav-item:hover{background:rgba(108,99,255,.1);color:var(--text)}
    .nav-item.active{background:linear-gradient(135deg,rgba(108,99,255,.25),rgba(167,139,250,.15));color:var(--accent2)}
    .nav-item .icon{font-size:18px;width:22px;text-align:center}
    .sidebar-footer{margin-top:auto;border-top:1px solid var(--border);padding-top:16px}
    .user-chip{display:flex;align-items:center;gap:10px;padding:10px}
    .avatar-sm{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;flex-shrink:0}
    .user-name{font-size:13px;font-weight:600}
    .user-role{font-size:11px;color:var(--muted)}
    .main{margin-left:240px;flex:1;padding:36px 40px}
    .page-header{margin-bottom:28px}
    .page-header h2{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700}
    .page-header p{color:var(--muted);font-size:14px;margin-top:4px}
    .search-bar{display:flex;gap:10px;margin-bottom:32px}
    .search-bar input{flex:1;padding:12px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
    .search-bar input:focus{border-color:var(--accent)}
    .search-bar input::placeholder{color:var(--muted)}
    .btn-search{padding:12px 22px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
    .search-results{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:24px;overflow:hidden;display:none}
    .search-result-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);transition:background .15s}
    .search-result-item:last-child{border-bottom:none}
    .s-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;flex-shrink:0}
    .s-info{flex:1}
    .s-name{font-weight:600;font-size:14px}
    .s-email{font-size:12px;color:var(--muted)}
    .btn-add{padding:8px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
    .btn-add:disabled{opacity:.5;cursor:not-allowed}
    .tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--border)}
    .tab{padding:10px 20px;border:none;background:none;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;margin-bottom:-1px}
    .tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
    .friends-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .friend-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;transition:all .25s}
    .friend-card:hover{border-color:var(--accent);transform:translateY(-2px)}
    .f-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .f-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;flex-shrink:0}
    .f-name{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600}
    .f-class{font-size:12px;color:var(--muted);margin-top:2px}
    .f-actions{display:flex;gap:8px}
    .btn-msg{flex:1;padding:8px;background:rgba(108,99,255,.12);border:none;border-radius:8px;color:var(--accent2);font-size:13px;font-weight:600;cursor:pointer}
    .btn-msg:hover{background:rgba(108,99,255,.22)}
    .btn-remove{padding:8px 10px;background:transparent;border:1.5px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer;transition:all .2s}
    .btn-remove:hover{border-color:#f87171;color:#f87171}
    .req-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:14px;margin-bottom:12px}
    .req-info{flex:1}
    .req-name{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600}
    .req-meta{font-size:12px;color:var(--muted);margin-top:2px}
    .req-actions{display:flex;gap:8px}
    .btn-accept{padding:8px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
    .btn-decline{padding:8px 14px;background:transparent;border:1.5px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer}
    .badge-req{background:rgba(251,191,36,.15);color:#f59e0b;display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);padding:12px 24px;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;transition:transform .35s;z-index:99;color:#fff}
    .toast.show{transform:translateX(-50%) translateY(0)}
    .empty-msg{color:var(--muted);font-size:14px;text-align:center;padding:40px 0}
    @media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:20px}}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo"><div class="logo-icon">📚</div><span>Notes Hub</span></div>
    <div class="nav-label">Menu</div>
    <a href="dashboard.html" class="nav-item"><span class="icon">🏠</span> Dashboard</a>
    <a href="send.html" class="nav-item"><span class="icon">📤</span> Send Notes</a>
    <a href="receive.html" class="nav-item"><span class="icon">📥</span> Receive Notes</a>
    <a href="friends.html" class="nav-item active"><span class="icon">👥</span> Friends</a>
    <a href="profile.html" class="nav-item"><span class="icon">👤</span> Profile</a>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar-sm" id="sb-avatar">?</div>
        <div><div class="user-name" id="sb-name">Loading…</div><div class="user-role">Student</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="page-header"><h2>👥 Friends</h2><p>Classmates ko dhundo aur connect karo</p></div>

    <div class="search-bar">
      <input type="text" id="friend-search" placeholder="Student ka naam ya email likho…" onkeydown="if(event.key==='Enter')searchFriends()"/>
      <button class="btn-search" onclick="searchFriends()">Search</button>
    </div>
    <div class="search-results" id="search-results"></div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('friends',this)">My Friends <span id="f-count">(0)</span></button>
      <button class="tab" onclick="switchTab('requests',this)">Requests <span class="badge-req" id="r-count">0</span></button>
    </div>

    <div id="tab-friends"><div class="friends-grid" id="friends-grid"><div class="empty-msg">Loading…</div></div></div>
    <div id="tab-requests" style="display:none"><div id="requests-list"><div class="empty-msg">Loading…</div></div></div>
  </main>

  <div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs, addDoc, doc, updateDoc, deleteDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADqcDzajzBja4t7Gx310bTLSColxcz2Ns",
    authDomain: "school-29086.firebaseapp.com",
    projectId: "school-29086",
    storageBucket: "school-29086.firebasestorage.app",
    messagingSenderId: "358547829043",
    appId: "1:358547829043:web:0e105cb2d411654db14e46"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const colors = ['#f59e0b,#ef4444','#6c63ff,#a78bfa','#22c55e,#16a34a','#06b6d4,#0284c7','#ec4899,#f43f5e'];

  let currentUser = null;

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href='login.html'; return; }
    currentUser = user;
    const name = user.displayName || user.email.split('@')[0];
    document.getElementById('sb-name').textContent = name;
    document.getElementById('sb-avatar').textContent = name.slice(0,2).toUpperCase();
    loadFriends();
    loadRequests();
  });

  async function loadFriends() {
    const q = query(collection(db,'friends'), where('uid','==',currentUser.uid), where('status','==','accepted'));
    const snap = await getDocs(q);
    document.getElementById('f-count').textContent = `(${snap.size})`;
    const grid = document.getElementById('friends-grid');
    if (snap.empty) { grid.innerHTML='<div class="empty-msg">Abhi koi friend nahi. Upar search karo! 👆</div>'; return; }
    grid.innerHTML = snap.docs.map((d,i) => {
      const f = d.data();
      return `<div class="friend-card">
        <div class="f-top"><div class="f-avatar" style="background:linear-gradient(135deg,${colors[i%colors.length]})">${f.friendName.slice(0,2).toUpperCase()}</div>
        <div><div class="f-name">${f.friendName}</div><div class="f-class">${f.friendEmail}</div></div></div>
        <div class="f-actions">
          <button class="btn-msg" onclick="window.location.href='send.html'">📤 Note Bhejo</button>
          <button class="btn-remove" onclick="removeFriend('${d.id}')">✕</button>
        </div></div>`;
    }).join('');
  }

  async function loadRequests() {
    const q = query(collection(db,'friends'), where('friendUid','==',currentUser.uid), where('status','==','pending'));
    const snap = await getDocs(q);
    document.getElementById('r-count').textContent = snap.size;
    const el = document.getElementById('requests-list');
    if (snap.empty) { el.innerHTML='<div class="empty-msg">Koi pending request nahi</div>'; return; }
    el.innerHTML = snap.docs.map((d,i) => {
      const r = d.data();
      return `<div class="req-card">
        <div class="s-avatar" style="background:linear-gradient(135deg,${colors[i%colors.length]})">${r.name.slice(0,2).toUpperCase()}</div>
        <div class="req-info"><div class="req-name">${r.name}</div><div class="req-meta">${r.email}</div></div>
        <div class="req-actions">
          <button class="btn-accept" onclick="acceptRequest('${d.id}','${r.uid}','${r.name}','${r.email}')">Accept</button>
          <button class="btn-decline" onclick="declineRequest('${d.id}')">Decline</button>
        </div></div>`;
    }).join('');
  }

  window.searchFriends = async function() {
    const val = document.getElementById('friend-search').value.trim();
    if (!val) return;
    const resEl = document.getElementById('search-results');
    resEl.style.display='block';
    resEl.innerHTML='<div style="padding:14px 16px;color:var(--muted);font-size:13px">Searching…</div>';
    const q1 = query(collection(db,'users'), where('email','>=',val), where('email','<=',val+'\uf8ff'));
    const q2 = query(collection(db,'users'), where('name','>=',val), where('name','<=',val+'\uf8ff'));
    const [s1,s2] = await Promise.all([getDocs(q1),getDocs(q2)]);
    const seen = new Set(); const users = [];
    [...s1.docs,...s2.docs].forEach(d => {
      const u=d.data();
      if(!seen.has(u.uid)&&u.uid!==currentUser.uid){seen.add(u.uid);users.push(u);}
    });
    if(!users.length){resEl.innerHTML='<div style="padding:14px 16px;color:var(--muted);font-size:13px">Koi student nahi mila</div>';return;}
    resEl.innerHTML=users.map((u,i)=>`
      <div class="search-result-item">
        <div class="s-avatar" style="background:linear-gradient(135deg,${colors[i%colors.length]})">${u.name.slice(0,2).toUpperCase()}</div>
        <div class="s-info"><div class="s-name">${u.name}</div><div class="s-email">${u.email} ${u.cls?'· '+u.cls:''}</div></div>
        <button class="btn-add" id="add-${u.uid}" onclick="sendRequest('${u.uid}','${u.name}','${u.email}')">+ Add</button>
      </div>`).join('');
  };

  window.sendRequest = async function(uid,name,email) {
    const btn = document.getElementById('add-'+uid);
    btn.disabled=true; btn.textContent='Sending…';
    // Check already sent
    const existing = await getDocs(query(collection(db,'friends'), where('uid','==',currentUser.uid), where('friendUid','==',uid)));
    if(!existing.empty){showToast('Request pehle se bheji ja chuki hai','#f59e0b');return;}
    const myName = currentUser.displayName||currentUser.email.split('@')[0];
    await addDoc(collection(db,'friends'),{
      uid:currentUser.uid, name:myName, email:currentUser.email,
      friendUid:uid, friendName:name, friendEmail:email,
      status:'pending', createdAt:serverTimestamp()
    });
    btn.textContent='✓ Sent'; showToast(`✓ Request bheji ${name} ko!`,'#22c55e');
  };

  window.acceptRequest = async function(docId,fromUid,fromName,fromEmail) {
    await updateDoc(doc(db,'friends',docId),{status:'accepted'});
    // Reverse bhi add karo
    const myName = currentUser.displayName||currentUser.email.split('@')[0];
    await addDoc(collection(db,'friends'),{
      uid:currentUser.uid, name:myName, email:currentUser.email,
      friendUid:fromUid, friendName:fromName, friendEmail:fromEmail,
      status:'accepted', createdAt:serverTimestamp()
    });
    showToast(`✓ ${fromName} ab tumhara friend hai!`,'#22c55e');
    loadFriends(); loadRequests();
  };

  window.declineRequest = async function(docId) {
    await deleteDoc(doc(db,'friends',docId));
    showToast('Request decline kar di','#8b8fa8');
    loadRequests();
  };

  window.removeFriend = async function(docId) {
    if(!confirm('Is friend ko remove karna chahte ho?'))return;
    await deleteDoc(doc(db,'friends',docId));
    showToast('Friend remove ho gaya','#8b8fa8');
    loadFriends();
  };

  window.switchTab = function(tab,btn) {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-friends').style.display=tab==='friends'?'block':'none';
    document.getElementById('tab-requests').style.display=tab==='requests'?'block':'none';
  };

  function showToast(msg,bg){
    const t=document.getElementById('toast');
    t.textContent=msg;t.style.background=bg;
    t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);
  }
</script>
</body>
</html>
