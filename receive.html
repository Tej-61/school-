<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notes Hub – Receive Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f1117;--card:#181c27;--accent:#6c63ff;--accent2:#a78bfa;--text:#f0f0f5;--muted:#8b8fa8;--border:#2a2e3d;--green:#22c55e}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
    .sidebar{width:240px;min-height:100vh;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 16px;position:fixed;left:0;top:0}
    .logo{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:36px}
    .logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
    .logo span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px}
    .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:0 12px;margin-bottom:8px}
    .nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;transition:all .2s;margin-bottom:4px}
    .nav-item:hover{background:rgba(108,99,255,.1);color:var(--text)}
    .nav-item.active{background:linear-gradient(135deg,rgba(108,99,255,.25),rgba(167,139,250,.15));color:var(--accent2)}
    .nav-item .icon{font-size:18px;width:22px;text-align:center}
    .sidebar-footer{margin-top:auto;border-top:1px solid var(--border);padding-top:16px}
    .user-chip{display:flex;align-items:center;gap:10px;padding:10px}
    .avatar{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;flex-shrink:0}
    .user-name{font-size:13px;font-weight:600}
    .user-role{font-size:11px;color:var(--muted)}
    .main{margin-left:240px;flex:1;padding:36px 40px}
    .page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
    .page-header h2{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700}
    .page-header p{color:var(--muted);font-size:14px;margin-top:4px}
    .mark-btn{padding:8px 16px;border:1.5px solid var(--border);background:transparent;border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer;transition:all .2s}
    .mark-btn:hover{border-color:var(--accent2);color:var(--accent2)}
    .filters{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
    .filter-btn{padding:7px 16px;border:1.5px solid var(--border);background:transparent;border-radius:20px;color:var(--muted);font-size:13px;cursor:pointer;transition:all .2s}
    .filter-btn.active{border-color:var(--accent);background:rgba(108,99,255,.12);color:var(--accent2)}
    .search-bar input{padding:8px 14px;background:var(--card);border:1.5px solid var(--border);border-radius:20px;color:var(--text);font-size:13px;outline:none;width:200px;transition:border-color .2s}
    .search-bar input:focus{border-color:var(--accent)}
    .notes-list{display:flex;flex-direction:column;gap:12px}
    .note-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;cursor:pointer;transition:all .25s;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
    .note-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(108,99,255,.12)}
    .note-card.unread{border-left:3px solid var(--accent)}
    .note-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;flex-shrink:0}
    .note-from{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin-bottom:3px}
    .note-subject{font-size:14px;font-weight:500;margin-bottom:3px}
    .note-preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .note-time{font-size:12px;color:var(--muted);text-align:right}
    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase}
    .badge-new{background:rgba(108,99,255,.2);color:var(--accent2)}
    .badge-urgent{background:rgba(248,113,113,.15);color:#f87171}
    .empty-state{text-align:center;padding:64px 0;color:var(--muted)}
    .empty-state .icon{font-size:48px;margin-bottom:12px}
    .empty-state h3{font-family:'Space Grotesk',sans-serif;font-size:18px;color:var(--text);margin-bottom:6px}
    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
    .modal-overlay.open{display:flex}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto}
    .modal-header{padding:24px 28px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between}
    .modal-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700}
    .modal-meta{font-size:13px;color:var(--muted);margin-top:4px}
    .close-btn{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer}
    .modal-body{padding:28px;font-size:15px;line-height:1.8;white-space:pre-wrap}
    .modal-actions{padding:20px 28px;border-top:1px solid var(--border);display:flex;gap:10px}
    .btn-reply{padding:10px 20px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
    .btn-del{padding:10px 20px;border:1.5px solid #f87171;background:transparent;border-radius:8px;color:#f87171;font-size:14px;cursor:pointer;font-family:'Space Grotesk',sans-serif}
    @media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:20px}}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo"><div class="logo-icon">📚</div><span>Notes Hub</span></div>
    <div class="nav-label">Menu</div>
    <a href="dashboard.html" class="nav-item"><span class="icon">🏠</span> Dashboard</a>
    <a href="send.html" class="nav-item"><span class="icon">📤</span> Send Notes</a>
    <a href="receive.html" class="nav-item active"><span class="icon">📥</span> Receive Notes</a>
    <a href="friends.html" class="nav-item"><span class="icon">👥</span> Friends</a>
    <a href="profile.html" class="nav-item"><span class="icon">👤</span> Profile</a>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="sb-avatar">?</div>
        <div><div class="user-name" id="sb-name">Loading…</div><div class="user-role">Student</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div><h2>📥 Received Notes</h2><p>Tumhare liye aaye notes</p></div>
      <button class="mark-btn" onclick="markAllRead()">Mark all read</button>
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" onclick="setFilter('unread',this)">Unread</button>
      <div class="search-bar" style="margin-left:auto">
        <input type="text" id="search" placeholder="🔍 Search…" oninput="renderNotes()"/>
      </div>
    </div>
    <div class="notes-list" id="notes-list">
      <div class="empty-state"><div class="icon">⏳</div><h3>Loading…</h3></div>
    </div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <div><div class="modal-title" id="modal-title"></div><div class="modal-meta" id="modal-meta"></div></div>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn-reply" id="reply-btn">↩ Reply</button>
        <button class="btn-del" onclick="deleteNote()">🗑 Delete</button>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, query, where, orderBy, getDocs, doc, updateDoc, deleteDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADqcDzajzBja4t7Gx310bTLSColxcz2Ns",
    authDomain: "school-29086.firebaseapp.com",
    projectId: "school-29086",
    storageBucket: "school-29086.firebasestorage.app",
    messagingSenderId: "358547829043",
    appId: "1:358547829043:web:0e105cb2d411654db14e46"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let allNotes = [];
  let activeFilter = 'all';
  let openNoteDocId = null;
  const avatarColors = ['#f59e0b,#ef4444','#6c63ff,#a78bfa','#22c55e,#16a34a','#06b6d4,#0284c7','#ec4899,#f43f5e'];

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = 'login.html'; return; }
    const name = user.displayName || user.email.split('@')[0];
    document.getElementById('sb-name').textContent = name;
    document.getElementById('sb-avatar').textContent = name.slice(0,2).toUpperCase();
    await loadNotes(user.uid);
  });

  async function loadNotes(uid) {
    const q = query(collection(db,'notes'), where('toUid','==',uid), orderBy('createdAt','desc'));
    const snap = await getDocs(q);
    allNotes = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
    renderNotes();
  }

  window.renderNotes = function() {
    const q = document.getElementById('search').value.toLowerCase();
    let filtered = allNotes;
    if (activeFilter === 'unread') filtered = allNotes.filter(n => !n.read);
    if (q) filtered = filtered.filter(n => n.subject?.toLowerCase().includes(q) || n.fromName?.toLowerCase().includes(q));

    const el = document.getElementById('notes-list');
    if (filtered.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">📭</div><h3>Koi note nahi mila</h3><p>Inbox abhi khali hai</p></div>`;
      return;
    }
    el.innerHTML = filtered.map((n,i) => {
      const t = n.createdAt?.toDate ? n.createdAt.toDate().toLocaleString('en-PK',{dateStyle:'short',timeStyle:'short'}) : '';
      return `<div class="note-card ${n.read?'':'unread'}" onclick="openNote('${n.docId}')">
        <div class="note-avatar" style="background:linear-gradient(135deg,${avatarColors[i%avatarColors.length]})">${(n.fromName||'?').slice(0,2).toUpperCase()}</div>
        <div>
          <div class="note-from">${n.fromName||'Unknown'} ${!n.read?'<span class="badge badge-new">New</span>':''} ${n.priority==='urgent'?'<span class="badge badge-urgent">Urgent</span>':''}</div>
          <div class="note-subject">${n.subject}</div>
          <div class="note-preview">${(n.body||'').slice(0,80)}…</div>
        </div>
        <div class="note-time">${t}</div>
      </div>`;
    }).join('');
  };

  window.setFilter = function(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderNotes();
  };

  window.openNote = async function(docId) {
    const n = allNotes.find(x => x.docId === docId);
    if (!n) return;
    openNoteDocId = docId;
    document.getElementById('modal-title').textContent = n.subject;
    const t = n.createdAt?.toDate ? n.createdAt.toDate().toLocaleString('en-PK',{dateStyle:'medium',timeStyle:'short'}) : '';
    document.getElementById('modal-meta').textContent = `From: ${n.fromName} · ${t}`;
    document.getElementById('modal-body').textContent = n.body;
    document.getElementById('reply-btn').onclick = () => { closeModal(); sessionStorage.setItem('reply_to', JSON.stringify({uid:n.fromUid,name:n.fromName,email:n.fromEmail})); window.location.href='send.html'; };
    document.getElementById('modal').classList.add('open');
    // Mark as read
    if (!n.read) {
      await updateDoc(doc(db,'notes',docId), { read: true });
      n.read = true;
      renderNotes();
    }
  };

  window.closeModal = function() { document.getElementById('modal').classList.remove('open'); };

  window.deleteNote = async function() {
    if (!openNoteDocId) return;
    if (!confirm('Yeh note delete karna chahte ho?')) return;
    await deleteDoc(doc(db,'notes',openNoteDocId));
    allNotes = allNotes.filter(n => n.docId !== openNoteDocId);
    closeModal();
    renderNotes();
  };

  window.markAllRead = async function() {
    const unread = allNotes.filter(n => !n.read);
    await Promise.all(unread.map(n => updateDoc(doc(db,'notes',n.docId), { read: true })));
    allNotes.forEach(n => n.read = true);
    renderNotes();
  };

  document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
</script>
</body>
</html>
